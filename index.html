    <!--
      Critical, inline, zero-dependency boot screen.
      It is painted from the very first byte of HTML — before any JS/CSS/font arrives —
      so on a 2G connection the visitor sees the "system boot" instead of a white page.
      The Vue app takes over the same element once mounted.
    -->
    <style>
      :root { --bg: #e8e7e4; --ink: #2a2926; --ink-2: #6a6863; --line: #b4b2ab; --accent: #8f7344; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); }
      body { font-family: ui-monospace, "IBM Plex Mono", SFMono-Regular, Menlo, Consolas, monospace; }
      #boot {
        position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column;
        justify-content: center; align-items: center; background: var(--bg); color: var(--ink);
        font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
      }
      #boot .line { display: flex; gap: .75em; opacity: .9; }
      #boot .dim { color: var(--ink-2); }
      #boot .cur { display: inline-block; width: .6em; height: 1.1em; background: var(--ink); vertical-align: -.15em; animation: blink 1s steps(1) infinite; }
      #boot .bar { margin-top: 1.5rem; width: 12rem; height: 2px; background: var(--line); position: relative; overflow: hidden; }
      #boot .bar::after { content: ""; position: absolute; inset: 0; width: 35%; background: var(--accent); animation: sweep 1.6s linear infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes sweep { from { transform: translateX(-100%); } to { transform: translateX(300%); } }
      @media (prefers-reduced-motion: reduce) { #boot .cur, #boot .bar::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot" aria-live="polite" aria-label="Loading">
      <div class="line"><span class="dim">SYSTEM://</span><span>WEDDING_NOTIFICATION</span></div>
      <div class="line" style="margin-top:.5em"><span class="dim">&gt;</span><span>BOOT<span class="cur"></span></span></div>
      <div class="bar"></div>
    </div>

    <div id="app"></div>

    <noscript>
      <!-- Pure-HTML fallback: the invitation still reads when JS is blocked or never arrives. -->
      <style>#boot{display:none}</style>
      <main style="max-width:36rem;margin:0 auto;padding:3rem 1.25rem;font-family:ui-sans-serif,system-ui,sans-serif;line-height:1.6">

        <p>Шумо даъват шудаед. · Вы приглашены.</p>

          Падари арӯс / Отец невесты — Алишер: <a href="tel:+992123123123">+992 12 312 31 23</a>
        </p>
      </main>
    </noscript>

    <script type="module" src="/src/main.ts"></script>
